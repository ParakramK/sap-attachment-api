name: Release

# Release waits for the CI workflow run to finish before doing anything;
# CI itself runs once (on the tag push), not a second time inside this file.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v0.4'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Check CI result and resolve tag
        id: meta
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="$DISPATCH_VERSION"
          else
            if [ "$CONCLUSION" != success ]; then
              echo "CI run did not pass (conclusion: $CONCLUSION)" >&2
              exit 1
            fi
            version=$(git tag --points-at HEAD | grep '^v' | head -1 || true)
          fi
          if [ -z "$version" ]; then
            echo "No v* tag on this commit — nothing to release."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.version != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true # module cache shared with CI

      - name: Cross-compile binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          name="sap-attachment-api-${VERSION}-${GOOS}-${GOARCH}"
          if [ "$GOOS" = windows ]; then name="$name.exe"; fi
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/$name" ./cmd/server
          (cd dist && sha256sum "$name" > "$name.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            v[0-9]*.*) ;;
            *) echo "Invalid VERSION '$VERSION' — pass a tag like v0.4" >&2; exit 1 ;;
          esac
          # A leading dot is rejected in release asset names, so ship it as
          # env.example; dist/* picks it up normally.
          cp .env.example dist/env.example
          extra=()
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            extra+=(--target "${{ needs.prepare.outputs.sha }}")
          fi
          gh release create "$VERSION" dist/* --generate-notes "${extra[@]}"
